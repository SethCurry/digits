[project]
name = "digipy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seth Curry", email = "seth@scurry.io" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
    "tensorflow>=2.22.0rc0",
]

[project.scripts]
digipy = "digipy:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
