[project]
name = "digipy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seth Curry", email = "seth@scurry.io" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
    "pydot>=4.0.1",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
digipy = "digipy:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
